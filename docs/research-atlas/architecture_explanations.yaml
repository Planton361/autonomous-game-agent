  CMP-OBSERVATION-BUILDER:
    area: Observation & Perception
    responsibility: Observation Builder assembles one typed, screenshot-linked visible observation.
    why: A common payload keeps perceptual signals and their provenance together at module boundaries.
    normative: Combine admissible visible signals with evidence IDs without inventing goals or hidden
      semantic identity.
    mechanism: On build, sanitize bridge data, compute the frame signature, ask the configured OCR engine,
      classify UI, normalize visible sprites and construct Observation with screenshot/evidence linkage
      and optional last action result.
    inputs: ScreenFrame, EvidenceRecord, optional bridge mapping and ActionResult.
    outputs: Observation ready for context/control consumers.
    implementation: Assembly is implemented with injectable OCR and deny-by-default sanitization.
