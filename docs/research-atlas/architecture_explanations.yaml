components:
  CMP-CORTEX:
    area: Strategic Reasoning
    responsibility: Cortex proposes the next evidence-grounded goal and a reusable skill, and can reflect
      on a completed attempt.
    why: Slow reasoning can weigh uncertainty and prior experience while Manager and Body preserve a bounded
      execution boundary.
    normative: On meaningful new evidence, completion, failure, contradiction or a strategically relevant
      alarm, reason over a bounded CortexContext. Propose a goal, capability, constraints, success criteria
      and evidence-linked memory requests. Never emit primitive keys, timings or direct InputExecutor
      calls.
    mechanism: When plan_next_goal is called, it checks the requested skill set, builds CortexContext
      from Observation and the caller-supplied memory summary, loads the prompt, and invokes the injected
      LLMClient. It parses PlannerOutput, rejects cited evidence outside the context and rejects an unavailable
      selected skill. The returned proposal still requires Manager validation and grounding. post_mortem
      separately parses reflection output; neither call writes memory or executes a skill.
    inputs: Observation, supplied facts/hypotheses/recent outcomes, available skills and risk constraints.
    outputs: PlannerOutput, or PostMortemOutput for reflection; both are proposals.
    implementation: Typed planning, context validation and provider injection exist. Fake/local/API provider
      choice is a separate configuration and cohort concern. Cortex itself has no primitive execution
      path.
    limitations: The memory summary is supplied by the caller; this is not automatic ranked retrieval.
      Event-driven invocation is a responsibility of the surrounding runtime. Valid JSON and evidence-scope
      checks do not prove a goal is useful, true or scientifically effective.
    example: 'Illustrative: visible text and a cited screenshot support a proposal to continue dialogue.
      Manager must still accept the capability; the Verifier later decides the visible outcome.'
    research_relevance: Existing program question and experience-to-action thread concern produced proposals
      and later evidence use. Their actual mappings and measurement links below are navigation, not findings.
    sources:
    - arch6
    - cortex
    - cortex-test
    - context
    - context-test
    - arch2
    - arch13
  CMP-MANAGER:
    area: Executive Control
    responsibility: Manager converts valid Cortex intent into bounded, visibly grounded skill contracts
      and owns their lifecycle.
    why: A plausible suggestion must pass capability, evidence, budget and termination checks before it
      can authorize action.
    normative: Validate the proposal and no-spoiler policy, reject unavailable capabilities or ambiguous
      targets, bind a visible target, action set, budget, risk, verifier, timeout and provenance, then
      schedule execution. Close or suspend the old contract before replanning.
    mechanism: TaskManager creates TaskSpec from PlannerOutput and required typed grounding. ManagerOrchestrator
      enqueues and starts it through TaskScheduler. ManagerTaskExecutor resolves the current task to Body
      and Verifier bindings. Completion requires the matching task and skill; Manager stop or canonical
      VerifierResult drives closure, while missing/nonterminal outcomes leave it open. Grounding and Scheduling
      and Completion are the registered children, not separate sources of primitive authority.
    inputs: PlannerOutput, GroundingResult from visible candidates, VerifierResult and Manager stop conditions.
    outputs: TaskSpec / bounded Skill Contract, scheduled task state and completion events.
    implementation: Proposal validation, typed contracts, grounding, scheduling and bounded execution
      composition are present; event sinks/logging must be configured by the caller.
    limitations: A TaskSpec object alone does not establish every runtime safety or Mission Run gate.
      Public mark_success/mark_failure APIs require correct caller authority; their existence is not an
      independent verification result. No full official screen-only loop is certified here.
    example: 'Illustrative: two equally supported object candidates cause grounding rejection. Body receives
      no guessed target; a fresh planning decision follows the closed/suspended attempt.'
    research_relevance: Existing proposal-to-contract research navigation and disposition measurement
      describe a possible observation point; they do not validate an instrument or an experiment.
    sources:
    - arch7
    - task-manager
    - task-manager-test
    - orchestrator
    - orchestrator-test
    - task-executor
    - task-executor-test
    - run
  CMP-MEMORY:
    area: Evidence, Memory & Retrieval
    responsibility: Memory retains evidence-linked experience and revisable knowledge outside Cortex.
    why: A later decision should be able to inspect what happened and distinguish observation, inference
      and contradiction without relying on the planner remembering a conversation.
    normative: Keep episodic trajectories, facts, hypotheses, observed topology, attempted strategies
      and skill competence with provenance. Expose relevant context through bounded retrieval. After death,
      separate observed outcome from inferred cause. Consolidation/Admission ownership remains design-open;
      no automatic fact gate is established.
    mechanism: MemoryDB stores typed observations, actions and skill results as SQLite records. FactStore
      manages proposition status, confidence and evidence; RoomGraphStore records observed transitions;
      StrategyGraphStore records attempts and outcomes; SkillRegistry aggregates history. Callers perform
      these writes. The six true children implement different storage responsibilities; Memory Retrieval
      is a sibling System component, not a child or a Cortex submodule.
    inputs: Observation and caller-provided action/skill records; declared VerifierResult, PostMortemOutput
      and MemoryUpdateRequest context.
    outputs: Persisted experience and queryable records. A requested update is not automatically admitted
      knowledge.
    implementation: SQLite persistence and the specialized stores exist. The overall memory lifecycle
      is partial.
    limitations: There is no complete ranked retrieval snapshot, autonomous synthesis or accepted consolidation/admission
      owner. Fact status is caller-controlled storage metadata, not proof. Life Episode continuity is
      allowed with provenance within one Mission Run; independent Mission Runs do not inherit memory automatically.
    example: 'Illustrative: a failed interaction and its screenshot are stored; “the object may require
      another approach” stays a hypothesis. A later context can cite the attempt without treating the
      inferred cause as observed.'
    research_relevance: Experience-to-knowledge is the program context, not a fabricated Memory-specific
      research mapping. Use only the actual attached records and sources below.
