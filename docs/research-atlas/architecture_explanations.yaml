  CMP-EVIDENCE-LEDGER:
    area: Evidence, Memory & Retrieval
    responsibility: Evidence Ledger anchors screenshots and event histories to inspectable records.
    why: Memory, grounding and verification must be traceable to what was actually observed and executed.
    normative: Retain immutable screenshot/text/action/outcome/receipt links, hashes, timestamps and run
