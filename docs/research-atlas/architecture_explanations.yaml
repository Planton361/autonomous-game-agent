    outputs: Contract-allowed primitive proposal or wait/stop (normative).
    implementation: 'Target-only: heuristic skills exist, but the declared reflex mechanism is missing.'
    limitations: No trigger/cooldown/eligibility lifecycle or measured containment is implemented for
      a distinct Reflex path.
    example: 'Normative illustration: a declared hazard response may wait or retreat only if that action
      is already allowed; it cannot open another goal.'
    research_relevance: Reflex containment requires later explicit validation, not an assumed mapping
      or result.
    sources:
    - arch10
    - body
    - body-test
    - run
  CMP-SAFETY-FILTER:
    area: Action & Safety
    responsibility: SafetyFilter assesses a proposed movement against supplied hazard signals.
    why: An allowed action still needs a risk check before execution.
    normative: Keep valid contract, visible hazard constraints and safety enforcement distinct; a planner
      or skill cannot bypass the input gates.
    mechanism: The pure SafetyFilter predicts the next position for a movement candidate, computes risk
      from supplied HazardSignal objects and compares it with its threshold. It returns allowed/rejected
      risk information and can assess several candidates. It does not acquire hazard pixels or send keys.
    inputs: Current ScreenPoint, proposed action and supplied hazards.
    outputs: SafetyFilterResult with blocked flag, risk score and reasons.
    implementation: Synthetic navigation risk assessment is implemented; full safety filtering is partial.
    limitations: Visible hazard acquisition and a universal runtime risk boundary are not established.
      This filter alone does not enforce focus, emergency stop, contract or durable logging.
    example: 'Illustrative: a move predicted to enter a supplied hazard region is rejected; the test does
      not prove the hazard detector exists.'
    research_relevance: Risk assessments are technical checks, not measured real-game safety outcomes.
    sources:
    - arch14
    - safety
    - safety-test
  CMP-INPUT-EXECUTOR:
    area: Action & Safety
    responsibility: InputExecutor is the guarded boundary that can send one primitive through an input
      backend.
    why: Actual keyboard input needs focus, rate and emergency-stop enforcement separate from planning.
    normative: Execute only with active valid Manager contract, verified intended window, allowed action,
      rate capacity, functional emergency stop and durable before/after evidence logging.
    mechanism: InputExecutor.execute checks emergency stop, target focus and rate capacity before backend.send;
      blocked paths return ActionResult. ManagerTaskExecutor and SkillRunner separately compose current-task
      and action-mask checks; transition logging must be configured. The executor is not the success authority.
    inputs: Primitive proposal, target-window/focus service, rate limiter and emergency stop.
    outputs: Executed or blocked ActionResult.
    implementation: Guarded primitive execution is implemented.
    limitations: 'The class alone does not enforce all canonical preconditions: active contract, action
      mask and durable evidence linkage depend on surrounding composition. A sent key is not task success.'
    example: 'Illustrative: focus loss blocks backend.send and returns a blocked result.'
    research_relevance: Input safety is a hard eligibility boundary; synthetic checks are not authorization
      for Live execution.
    sources:
    - arch14
    - input
    - input-test
    - runner
    - task-executor
  CMP-INDEPENDENT-VERIFIER:
    area: Independent Verification
    responsibility: Independent Verifier evaluates visible outcome without letting Cortex grade its own
      proposal.
    why: Execution and interpretation must not automatically become claimed success or reward.
    normative: Prefer deterministic visible success/failure and progress detectors; abstain on uncertainty.
      Return canonical outcomes, failure category and evidence. Rewards require validated events; image/hash
      changes alone are not success.
    mechanism: ReachTargetVerifier independently checks visible death or arrival at an evidence-linked
      grounded point, otherwise abstaining. ContinueDialogueVerifier and InteractVisibleObjectVerifier
      evaluate their bounded visible conditions. SkillRunner obtains VerifierResult; Manager consumes
      it for lifecycle transitions. Cortex reflection is separate.
    inputs: Task/grounded target and before/after visible Observations.
    outputs: 'VerifierResult: success, progress, failure or abstain with evidence.'
    implementation: Deterministic skill-specific verifiers and a catalog exist.
    limitations: Limited detectors do not validate every outcome, confidence calibration or false-success
      rate. The separate Visible Outcome artifact remains target-only; a screenshot change is insufficient.
    example: 'Illustrative: new pixels without visible target arrival cause abstention rather than success.'
    research_relevance: Existing verified-outcome measurement remains distinct from detector availability;
      no scientific result is supplied.
    sources:
    - arch11
    - verifier
    - verifier-test
    - dialogue
    - dialogue-test
    - interaction
    - interaction-test
  CMP-REPLAY-BUFFER:
    area: Between-Mission-Run Learning
    responsibility: Replay Buffer retains bounded transition material for optional later learning.
    why: Training data needs reusable observations/actions/outcomes without changing the active controller.
    normative: Collect only admissible, provenance-linked transitions with independently validated labels.
      Separate cohorts and contamination; use eligible material only under authorized between-Mission-Run
      training.
    mechanism: ReplayBuffer appends typed ReplayTransition objects into a fixed-capacity FIFO and can
      sample them with a seed. ReplayTransition recursively rejects forbidden metadata keys. obs/action/reward/next_obs/done/task
      are supplied by callers; the buffer does not validate official run eligibility.
    inputs: ReplayTransition with observation, action, reward, next observation, done, task and metadata.
    outputs: Retained transitions and deterministic seeded samples.
    implementation: FIFO storage and sampling exist; complete replay eligibility is partial.
    limitations: No complete Mission Run/Life Episode/contract/verifier provenance admission or official
      training gate is enforced. Supplied reward is not automatically a validated scientific label.
    example: 'Illustrative: a capacity-three buffer discards the oldest of four synthetic transitions;
      this is storage behavior, not training.'
    research_relevance: Replay provides engineering material; no learning effect or new research finding
      is inferred.
    sources:
    - arch12
    - replay
    - replay-test
    - run
    - modes
  CMP-SKILL-TRAINER:
    area: Between-Mission-Run Learning
    responsibility: SkillTrainer is the target between-Mission-Run candidate-training responsibility.
    why: A controller should improve only through a separately authorized and auditable learning lifecycle.
    normative: After a Mission Run ends and a learning protocol authorizes it, select admissible demonstrations/failure
      subsets, train a candidate version, preserve training provenance and send the candidate for held-out
      validation. Never train or replace parameters between Life Episodes inside a Mission Run.
    mechanism: The target mechanism consumes eligible replay/demonstrations and produces a versioned candidate.
      Current build_behavior_cloning_dataset only converts synthetic transitions into supervised examples,
      optionally filtering positive rewards; it neither fits weights nor builds or deploys a candidate
      controller.
    inputs: Admissible transition/demonstration set and frozen authorized training configuration.
    outputs: Candidate Body Version (target-only), not an active controller.
    implementation: 'Target-only: dataset-building helpers exist, candidate training is missing.'
    limitations: No fitted candidate, complete training provenance, held-out lifecycle or deployment path
      is established. Positive caller-supplied reward is not an eligibility certificate.
    example: 'Normative illustration: failed target-reaching traces may motivate a later training set;
      the current frozen Mission Run remains unchanged.'
    research_relevance: Learning is planned architecture, not a reported experimental improvement.
    sources:
    - arch12
    - cloning
    - cloning-test
    - run
  CMP-BODY-CERTIFICATION:
    area: Between-Mission-Run Learning
    responsibility: Body Validation / Certification is the target gate between a trained candidate and
      future activation.
    why: A newly trained controller must not silently become executable because it produced a model file.
    normative: Evaluate a candidate on held-out scenarios, safety and false-success checks, then certify
      or reject it. Activate only a certified version for a next eligible Mission Run under separate authorization.
    mechanism: The normative gate binds candidate identity to held-out evidence and a certification/rejection
      decision, then controls future eligibility. Current behavior-cloning helpers only build datasets;
      no certification registry, candidate activation or complete validation pipeline is implemented.
    inputs: Candidate Body Version, held-out scenarios, validation evidence and authorized criteria.
    outputs: Certification/rejection and future activation eligibility (target architecture).
    implementation: 'Target-only: certification and activation mechanisms are missing.'
    limitations: Unit tests for data conversion are not held-out controller validation. No current source
      establishes an executable certify/reject/activate path.
    example: 'Normative illustration: a candidate with unsafe outcomes is rejected even if its average
      reward is higher; it cannot replace Body during an active Mission Run.'
    research_relevance: Certification requires future evidence; no empirical safety or efficacy claim
      is made.
    sources:
    - arch12
    - cloning
    - cloning-test
    - run
guides:
  System Overview:
    intro: The Agent observes admissible visible evidence, proposes goals, authorizes bounded execution
      and independently verifies the result. The seven sections below are reading areas, not Components
      or new technical parents. Individual Registry statuses describe bounded pieces; they do not establish
      a validated screen-only whole loop.
    sections:
    - title: Observation & Perception
      text: '[[id:CMP-SCREEN-CAPTURE]] captures a visible frame from [[id:ENV-GAME-INSTANCE]]. The [[id:CMP-VISIBLE-STATE-BRIDGE]]
        is optional and belongs to a separate bridge-assisted cohort with screenshot binding; screen-only
        never activates it. Neither acquisition route establishes task meaning. [[id:CMP-NO-SPOILER-FIREWALL]]
        filters optional bridge data. [[id:CMP-PERCEPTION]] uses its real children [[id:CMP-OBSERVATION-BUILDER]]
        and [[id:CMP-PERCEPTION-UI-STATE]] to assemble [[id:DAT-OBSERVATION]]. [[id:CMP-TEMPORAL-STATE]] should
        stabilize short histories but remains target-only. Current OCR/spatial production is limited; an image
        signature is not outcome evidence.'
    - title: Evidence, Memory & Retrieval
      text: '[[id:CMP-EVIDENCE-LEDGER]] anchors visible material. [[id:CMP-MEMORY]] contains [[id:CMP-MEM-EPISODIC]],
        [[id:CMP-MEM-FACTS]], [[id:CMP-MEM-HYPOTHESES]], [[id:CMP-MEM-TOPOLOGY]], [[id:CMP-MEM-STRATEGY]]
        and [[id:CMP-SKILL-COMPETENCE]]. [[id:CMP-MEM-RETRIEVAL]] is a System sibling of Memory; its bounded
        context route reaches Cortex through [[id:IF-MEM-CORTEX]] and [[id:CON-CORTEX-CONTEXT]]. Current context
        assembly consumes caller-selected memory; ranked snapshot retrieval is missing. See [[guide:Experience
        to Knowledge]]. Reflection/[[id:CON-POST-MORTEM-OUTPUT]] and [[id:CON-MEMORY-UPDATE-REQUEST]] propose
        evidence-driven knowledge revisions within a Mission Run; admission ownership is design-open. Life
        Episode continuity preserves admissible knowledge and frozen controller identities, as explained in
        [[guide:Experience to Knowledge]].'
    - title: Strategic Reasoning
      text: '[[id:CMP-CORTEX]] is slow and event-driven in the target architecture: new evidence, completion/failure,
        contradiction or relevant uncertainty can justify a call. It emits [[id:CON-PLANNER-OUTPUT]] through
        [[id:IF-CORTEX-MANAGER]]. Current typed planning validates output and cited evidence scope. A proposal
        is not permission, and Cortex never controls primitive keys or InputExecutor.'
    - title: Executive Control
      text: '[[id:CMP-MANAGER]] validates capabilities and evidence, uses [[id:CMP-MANAGER-GROUNDING]] to
        bind a visible target and [[id:CMP-MANAGER-SCHED-COMP]] to schedule and close [[id:CON-SKILL-CONTRACT]].
        Manager alone opens, closes, suspends or replans bounded contracts. Ambiguity fails closed. A skill
        contract is more concrete than a mission goal and more abstract than a key sequence.'
    - title: Action & Safety
      text: '[[id:CMP-BODY]] proposes one [[id:CON-PRIMITIVE-ACTION]] at a time within the active contract.
        [[id:CMP-BOUNDED-REFLEX]] is a target-only fast path under declared triggers and the same limits.
        [[id:CMP-SAFETY-FILTER]] assesses supplied hazards; [[id:CMP-INPUT-EXECUTOR]] sends guarded input
        only in correctly composed execution. Valid contract, allowed action, verified focus, rate capacity,
        emergency stop and durable before/after logging are all required. Current heuristic skills and input
        guards do not establish every canonical gate.'
    - title: Independent Verification
      text: After an action affects [[id:ENV-GAME-INSTANCE]], acquire a new Observation. [[id:CMP-INDEPENDENT-VERIFIER]]
        independently checks the visible outcome and supplies [[id:CON-VERIFIER-RESULT]] to Manager, abstaining
        when evidence is insufficient. Progress can continue a still-valid contract; terminal/stop conditions
        close or suspend it. Replanning calls Cortex with updated observation/memory context only when a new
        strategic decision is required and allowed. Thus the loop is Observation → Cortex proposal → Manager
        contract → Body → guarded input → environment → new Observation → Independent Verifier → VerifierResult
        → Manager transition, not a mandatory Cortex call per primitive. Current skill-specific detectors
        cover bounded visible conditions; a screenshot change alone is not success.
    - title: Between-Mission-Run Learning
      text: Optional, separately authorized learning occurs between Mission Runs. [[id:CMP-REPLAY-BUFFER]]
        retains partial transition material; [[id:CMP-SKILL-TRAINER]] and [[id:CMP-BODY-CERTIFICATION]] remain
        target-only candidate-training and held-out certification mechanisms. Only a certified candidate may
        be activated for a later eligible Mission Run under an authorized learning protocol. No parameter
        training or controller replacement occurs inside a Mission Run, including between its Life Episodes.
        Evidence-driven knowledge revision is separate from parameter training. Current replay and dataset
        helpers do not establish training, certification or activation. See [[guide:Scientific Experiment]].
    sources:
    - arch1
    - arch2
    - arch3
    - arch4
    - arch5
    - arch6
    - arch7
    - arch9
    - arch10
    - arch11
    - arch12
    - arch14
    - run
  Experience to Knowledge:
    intro: Knowledge revision changes evidence-linked records; parameter training changes a controller.
      These are separate operations with different authority and timing. This guide describes the target
      mechanism and the bounded stores currently present, not an observed learning result.
    sections:
    - title: Evidence and episodes
      text: 'Start from screenshots, visible text, allowed actions and independently checked outcomes
        in [[id:CMP-EVIDENCE-LEDGER]]. [[id:CMP-MEM-EPISODIC]] retains trajectory material: what was visible,
        proposed, authorized, executed and observed afterward. Current SQLite observations/actions/skill
        results and event logging provide material, not a complete consolidated episode entity.'
    - title: Facts, hypotheses and strategies
      text: '[[id:CMP-MEM-FACTS]] stores propositions, status/confidence and evidence. [[id:CMP-MEM-HYPOTHESES]]
        must preserve uncertainty and contradiction; it currently shares FactStore status storage rather
        than a complete test/adjudication lifecycle. [[id:CMP-MEM-TOPOLOGY]] records observed connections,
        never internal maps. [[id:CMP-MEM-STRATEGY]] stores caller-supplied approaches and outcomes; [[id:CMP-SKILL-COMPETENCE]]
        summarizes skill history rather than certifying a controller. Example: a failed visible interaction
        is an outcome; “the object requires another approach” is an interpretation, not an observed fact.'
    - title: Revision and admission remain open
      text: '[[id:CMP-CORTEX]] can propose [[id:CON-MEMORY-UPDATE-REQUEST]] and [[id:CON-POST-MORTEM-OUTPUT]].
        [[id:CMP-INDEPENDENT-VERIFIER]] supplies outcome evidence. None of these contracts automatically
        writes or accepts a fact. Consolidation/Admission ownership is explicitly design-open; no new
        Component, automatic promotion gate or hidden writer is introduced. Current store APIs permit
        caller-driven updates, which still require admissible provenance.'
    - title: Retrieval and later decisions
      text: '[[id:CMP-MEM-RETRIEVAL]] should select bounded, goal-relevant context, including contradictory
        evidence and prior failures, for [[id:CON-CORTEX-CONTEXT]]. Current build_plan_context consumes
        a supplied summary; ranked retrieval and a versioned snapshot are missing. Memory can influence
        a proposed goal, but only [[id:CMP-MANAGER]] authorizes its execution. A memory revision cannot
        expand permissions or budgets.'
    - title: Life Episode continuity
      text: Ordinary death closes the Life Episode with visible evidence and a post-mortem separating
        observation from inferred cause. If no terminal Mission Run condition is reached, a later Life
        Episode may retain admissible evidence, hypotheses, topology and strategies with provenance under
        the same Mission Run. Model, provider, prompts, Body version/weights and other frozen identities
        stay fixed. Process restart requires verified continuity; loss of provenance stops or quarantines
        the run.
    - title: Independent Mission Runs and parameter training
      text: Independent Mission Runs require their own identity, eligibility and protocol-defined starting
        state. Memory inheritance is not automatic; controlled history transfer needs a separate scientific
        contract. Optional [[id:CMP-REPLAY-BUFFER]] → [[id:CMP-SKILL-TRAINER]] → [[id:DAT-CANDIDATE-BODY-VERSION]]
        → [[id:CMP-BODY-CERTIFICATION]] training is separately authorized between Mission Runs, never
        between Life Episodes in one Mission Run. Dataset helpers do not train, certify or activate a
        controller.
    - title: Research route
      text: The experience-to-knowledge question belongs to Research B; it is not a result established
        by storage code. Use [[Research Map/Views/Research Steering|Research Steering]] for existing questions
        and mapped records, and [[Research Map/Views/Literature Inspection|Literature Inspection]] for
        available literature. Author once under the existing private record contract; generated pages
        link the same record to its declared Components. Missing mappings imply no novelty, gap or completeness
        judgment.
    sources:
    - arch5
    - arch6
    - arch11
    - arch12
    - run
    - restart
    - researchB
  Scientific Experiment:
    intro: The experiment unit is the Mission Run, not a primitive or an ordinary death. This guide explains
      the accepted protocol and research context; no experiment was executed and no outcome is supplied
      by this Research Map.
    sections:
    - title: Units and authority
      text: Mission Run > Life Episode > Grounded Skill Contract > primitive action. A Mission Run is
        one serious mission attempt with declared terminal conditions and frozen identity. Ordinary death
        ends a Life Episode; another may continue within the same Mission Run. [[id:CMP-MANAGER]] owns
        contracts, [[id:CMP-BODY]] acts within them, [[id:CMP-INPUT-EXECUTOR]] guards input and [[id:CMP-INDEPENDENT-VERIFIER]]
        checks visible outcomes. Cortex proposes; it never issues keys or grades its own success.
    - title: Frozen identity and admissible change
      text: Freeze run ID/mode, protocol/configuration/budgets, Cortex model/provider/prompt/config hashes,
        Body/controller/weights, harness and executable identities, and evidence/Manager/Verifier/safety
        boundaries before the first observation. During a Mission Run, admissible evidence-linked memory,
        hypotheses, contradictions, topology, strategies, plans, temporal observations and contract state
        may evolve. Budget consumption is allowed; silent budget expansion is not. Knowledge revision
        does not authorize parameter learning or boundary changes.
    - title: Restart and terminal conditions
      text: Application restart preserves the Mission Run only with manifest, frozen identity and provenance
        continuity. Otherwise stop or quarantine for review. Mission Run terminal conditions are independently
        verified mission success, frozen budget exhaustion, explicit authorized stop, unrecoverable integrity/safety
        failure or environment/harness failure. Contract timeout, no-progress, target loss and ordinary
        death do not automatically terminate the Mission Run. See [[guide:Experience to Knowledge]].
    - title: Run modes and separate cohorts
      text: screen-only is the primary official cohort, using pixels/OCR/visible outcomes and admissible
        memory with local inference and network isolation. bridge-assisted is a separate official diagnostic
        cohort with mandatory screenshots and deny-by-default visible bridge fields; never pool it with
        screen-only. debug is development/synthetic instrumentation, excluded from headline results. networked-api-exploratory
        is a separate capability-ceiling/development cohort. contaminated remains in accounting but is
        permanently excluded from admissible memory, training and official metrics.
    - title: Research A and Research B
      text: 'Research A asks how model configuration and behavioral instructions shape experience acquisition:
        goals, exploration, risk, repetition and stopping. Research B asks how experience across episodes
        becomes evidence-backed knowledge that supports later decisions. These are selected working directions,
        not proven causal chains or novelty claims. Existing [[id:RQ-PROGRAM-AB-001]] and [[id:THREAD-EXPERIENCE-TO-ACTION-001]]
        provide program navigation; local Component mappings are only the explicitly attached records.
        No confirmatory treatment, comparator, endpoint or scientific freeze is created by this guide.'
    - title: Provenance and evidence
      text: Record Git/dirty identity, model/provider/artifact, prompt/configuration hashes, seed, frozen
        budgets, host/runtime, window identity/resolution, allowlist/firewall version, official network-isolation
        proof and before/action/after evidence linkage. Grounded targets, memory updates and verifier
        outcomes need evidence IDs. Missing mandatory provenance invalidates an official claim; it is
        not reconstructed later from memory. Test PASS is technical evidence, not scientific outcome or
        phase exit. Independent visible-evidence review and separate cohort analysis remain required by
        the protocol.
    - title: Where to read and write research
      text: Use [[Research Map/Views/Research Steering|Research Steering]] and [[Research Map/Views/Literature
        Inspection|Literature Inspection]]. Existing private RQ, reading note, finding and other records
        stay authored once at their current paths; generated views merely project/link explicit mappings.
        Zotero/source PDFs remain literature authority. No private records, manuscript master or accepted
        findings are populated here.
    sources:
    - units
    - run
    - restart
    - modes
    - provenance
    - cohorts
    - researchA
    - researchB
    - arch7
    - arch11
