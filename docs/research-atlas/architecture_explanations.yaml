    - context-test
  CMP-SCREEN-CAPTURE:
    area: Observation & Perception
    responsibility: Screen Capture acquires the visible RGB frame without interpreting it.
    why: Every later visual claim needs a concrete player-visible observation boundary.
    normative: Capture the intended game window, retain capture time and dimensions, and link the frame
      to durable evidence before deriving state.
    mechanism: SubprocessPpmScreenCapture runs an explicitly configured command once with a timeout. It
      checks exit status, parses a binary P6 PPM header, validates dimensions and exact RGB byte count,
      and returns ScreenFrame. Capture-session composition can persist screenshot evidence; the adapter
      does not decide UI meaning.
    inputs: Explicit capture argv and capture clock.
    outputs: ScreenFrame with RGB bytes, dimensions and time.
    implementation: Subprocess capture and frame validation exist.
    limitations: The configured command must target the correct visible surface. Valid raster bytes alone
      prove neither window identity nor meaningful perception or task success.
    example: 'Illustrative: malformed PPM output is rejected before Observation construction.'
    research_relevance: Provides an evidence acquisition boundary; no Component-specific finding is inferred
      from capture tests.
    sources:
    - arch3
    - capture
    - capture-test
  CMP-VISIBLE-STATE-BRIDGE:
    area: Observation & Perception
    responsibility: The optional bridge adapts allowlisted, simultaneously visible fields in a separate
      bridge-assisted cohort.
    why: It supports diagnostic visible-data acquisition while preserving cohort and no-spoiler boundaries.
    normative: Keep screenshots mandatory; accept only allowlisted information visible to an ordinary
      player, record receipts and provenance, and never enable the bridge in screen-only.
    mechanism: BridgeObservationSource requests one raw payload, passes it through VisibleBridgeAdapter,
      verifies the declared mode, and in bridge-assisted mode requires screenshot_id to equal the latest
      durable screenshot for that run. Sanitization supplies the Observation; mode or screenshot mismatches
      fail.
    inputs: Visible payload, expected run mode, run ID and screenshot evidence lookup.
    outputs: Canonical Observation after sanitization and screenshot binding.
    implementation: The bridge adapter and current-screenshot binding are implemented.
    limitations: Binding an ID does not independently prove every field is visible. Runtime eligibility,
      isolation and surface validation remain separate obligations; results cannot be pooled with screen-only.
    example: 'Illustrative: a payload citing an older screenshot is rejected even when its keys are allowlisted.'
    research_relevance: Diagnostic cohort context only; no comparative result is supplied.
    sources:
    - arch3
    - bridge
    - bridge-test
    - modes
  CMP-NO-SPOILER-FIREWALL:
    area: Observation & Perception
    responsibility: The firewall limits bridge-like inputs to visible allowlisted fields.
    why: Technical access to hidden state must not become epistemic permission.
    normative: Deny by default, reject forbidden access as an integrity incident, and retain contamination
      provenance rather than silently repairing an official run.
    mechanism: NoSpoilerFirewall.sanitize checks raw top-level keys for the forbidden set and raises FirewallViolation
      on a match; it returns only allowed fields and drops other keys. ObservationBuilder and bridge sanitization
      use this boundary.
    inputs: Raw bridge-like mapping and explicit allowlist/forbidden set.
    outputs: Sanitized visible mapping or a violation.
    implementation: Key-based filtering and rejection are implemented.
    limitations: This class alone does not verify visibility, recursively classify arbitrary payloads
      or durably quarantine a Mission Run. Its error must be logged and handled by the surrounding integrity
      boundary.
    example: 'Illustrative: a hidden map identifier raises a violation; it is never admitted as a location
      fact.'
    research_relevance: Integrity is an eligibility constraint, not a scientific success metric established
      by a unit test.
    sources:
    - arch3
    - firewall
    - firewall-test
    - provenance
  CMP-PERCEPTION:
    area: Observation & Perception
    responsibility: Perception turns visible screen signals into an evidence-linked Observation.
    why: Planning and control need typed visible signals with uncertainty, not unqualified claims about
      pixels.
    normative: Extract visible text/UI, nonsemantic spatial candidates and confidence with screenshot
      links. Report visibility rather than deciding goals, quest meaning or success.
    mechanism: Observation Builder sanitizes optional bridge fields, computes a frame signature, calls
      OCR, classifies UI and normalizes visible sprite positions/hashes into Observation. UI State Classification
      and Observation Builder are the true children. SpatialPerceptionProducer is a declared interface,
      not a demonstrated pixel detector.
    inputs: ScreenFrame, screenshot evidence, optional sanitized bridge fields and last action result.
    outputs: Observation with text, UI, spatial signals and evidence references.
    implementation: Observation assembly and deterministic UI rules exist; overall perception is partial.
    limitations: Default OCR returns no text; static OCR is a fixture. No learned pixel detector or validated
      screen-only perception quality is established. A signature change is not success.
    example: 'Illustrative: absent text and visible UI signals can yield unknown rather than an invented
      screen meaning.'
    research_relevance: Perception quality requires separate datasets and measurements; existing source
      attachments below are the available record set.
