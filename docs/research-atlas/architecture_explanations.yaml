  CMP-BODY:
    area: Action & Safety
    responsibility: Body executes reusable skills within the active Manager contract and proposes one
      primitive at a time.
    why: Fast local control should remain independent of slow planning while obeying the same bounded
      interface.
    normative: Use authorized visible/temporal state, grounded target, goal/skill, short history and allowed-action
      mask. Preserve the controller/weights through the Mission Run. A future learned shared policy uses
      the same contract interface.
