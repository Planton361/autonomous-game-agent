  CMP-TEMPORAL-STATE:
    area: Observation & Perception
    responsibility: Temporal State should stabilize recent visible observations into short-horizon control
      signals.
    why: One frame cannot establish motion, sustained no-progress or target continuity.
    normative: On successive evidence-linked observations, maintain recent positions, appearance/disappearance
      events, stable UI transitions, progress windows, repeated-action loops and target visibility. Report
      uncertainty and alarms to bounded control; never infer hidden identity from persistence alone.
    mechanism: The normative mechanism compares a short history and emits stabilized signals or a no-progress/visibility
      warning. Current code has local step/history handling in SkillRunner; there is no central Temporal
      State component implementing this mechanism. A frame hash alone is not temporal reasoning.
    inputs: Recent Observations, evidence times and action history.
    outputs: Target continuity, motion/progress windows and uncertainty signals (target architecture).
    implementation: 'Target-only: local execution history exists, but the centralized temporal mechanism
      is missing.'
    limitations: No complete stabilization, motion estimator or common temporal summary is established.
    example: 'Normative illustration: several unchanged target positions after allowed moves can raise
      no-progress; one unchanged image cannot establish that conclusion.'
