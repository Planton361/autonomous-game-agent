  CMP-PERCEPTION-UI-STATE:
    area: Observation & Perception
    responsibility: UI State Classification labels visible UI signals and exposes uncertainty.
    why: Body and Manager need to distinguish dialogue, menu, combat or death without guessing hidden
      state.
    normative: Derive UI state from admissible visible information, keep confidence and evidence, and
      report uncertainty when signals are insufficient.
