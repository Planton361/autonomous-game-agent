    inputs: Captured frame or existing screenshot, run ID and runtime events.
    outputs: Screenshot EvidenceRecord and append-only event material.
    implementation: Screenshot metadata and event storage exist; the overall ledger is partial.
    limitations: EvidenceStore can write to an existing generated ID path; a frozen metadata object alone
