    pixel detector.
  technical:
    architecture_authority: canonical-target
    implementation_status: partial
    verification_status: unverified
  atlas_level: L2
  overview_visibility: main
  overview_order: 30
- id: DAT-OBSERVATION
  type: DataArtifact
  name: Observation
  description: Typed visible observation payload with screenshot/evidence references, UI, text, spatial
