  technical:
    architecture_authority: canonical-target
    implementation_status: implemented
    verification_status: unverified
  atlas_level: L2
  overview_visibility: main
  overview_order: 29
- id: CMP-PERCEPTION
  type: Component
  name: Perception
  description: ObservationBuilder assembles frame signatures, OCR output and UI signals. OCR backends
