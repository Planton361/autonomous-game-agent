    architecture_authority: canonical-target
    implementation_status: implemented
    verification_status: integration-tested
  atlas_level: L2
  overview_visibility: main
  overview_order: 11
- id: RQ-PROGRAM-AB-001
  type: ResearchQuestion
  name: Program A–B working question
  description: Wie prägen Modellkonfiguration und Verhaltensinstruktion die eigene Erfahrungsgewinnung
    eines zielgerichteten LLM-Agenten, und wie wird diese Erfahrung über Episoden hinweg zu Wissen,
    das spätere Entscheidungen unterstützt?
  atlas_level: null
  overview_visibility: null
  overview_order: 12
