- id: CMP-MEM-RETRIEVAL
  type: Component
  name: Memory Retrieval
  description: Cortex should receive a bounded snapshot of admissible memory. Persistence
    and evidence-backed facts exist; caller-supplied memory_summary reaches context
    assembly. A dedicated retriever, versioned RetrievalSnapshot, and ranking/eligibility
    retrieval are not established.
  technical:
    architecture_authority: canonical-target
    implementation_status: partial
    verification_status: unverified
- id: CMP-CORTEX
  type: Component
  name: Cortex
  description: 'Slow evidence-grounded planner: consumes bounded context and proposes
    typed goals and constraints to Manager. Primitive control is outside its authority.'
  technical:
    architecture_authority: canonical-target
    implementation_status: implemented
    verification_status: integration-tested
- id: CMP-MANAGER
  type: Component
  name: Manager
  description: Authority boundary for validating proposals, grounding visible targets,
    constructing bounded task contracts, scheduling and closing them using verified
    outcomes. TaskSpec is a Contract.
  technical:
    architecture_authority: canonical-target
    implementation_status: implemented
    verification_status: integration-tested
- id: RQ-PROGRAM-AB-001
  type: ResearchQuestion
  name: Program A–B working question
  description: Wie prägen Modellkonfiguration und Verhaltensinstruktion die eigene
    Erfahrungsgewinnung eines zielgerichteten LLM-Agenten, und wie wird diese Erfahrung
    über Episoden hinweg zu Wissen, das spätere Entscheidungen unterstützt?
- id: THREAD-EXPERIENCE-TO-ACTION-001
  type: ResearchThread
  name: Experience to Action
  description: Experience -> Memory Retrieval -> Cortex -> Manager -> Action -> Outcome.
    Cross-cutting working path, not a proven causal chain or technical hierarchy;
    no experiment authorization.
- id: DEC-ATLAS-PILOT-001
  type: Decision
  name: Approved Atlas pilot scope
  description: 'Issue #46 approves metadata/tooling only, including existing measurement
    mappings; no architecture decomposition or new research decision.'
