  technical:
    architecture_authority: canonical-target
    implementation_status: partial
    verification_status: unverified
  atlas_level: L2
  overview_visibility: main
  overview_order: 35
- id: CMP-MEMORY
  type: Component
  name: Memory
  description: SQLite observations, actions, skill results, facts, topology and strategies exist.
