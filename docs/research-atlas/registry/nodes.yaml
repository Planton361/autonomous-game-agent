    architecture_authority: canonical-target
    implementation_status: implemented
    verification_status: integration-tested
  atlas_level: L2
  overview_visibility: main
  overview_order: 10
- id: CMP-MANAGER
  type: Component
  name: Manager
  description: Authority boundary for validating proposals, grounding visible targets, constructing
    bounded task contracts, scheduling and closing them using verified outcomes. TaskSpec is a Contract.
