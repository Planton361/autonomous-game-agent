- id: CMP-MEM-RETRIEVAL
  type: Component
  name: Memory Retrieval
  description: Cortex should receive a bounded snapshot of admissible memory. Persistence and evidence-backed
    facts exist; caller-supplied memory_summary reaches context assembly. A dedicated retriever, versioned
    RetrievalSnapshot, and ranking/eligibility retrieval are not established.
  technical:
    architecture_authority: canonical-target
    implementation_status: partial
    verification_status: unverified
  atlas_level: L2
  overview_visibility: main
  overview_order: 9
- id: CMP-CORTEX
  type: Component
  name: Cortex
  description: 'Slow evidence-grounded planner: consumes bounded context and proposes typed goals
    and constraints to Manager. Primitive control is outside its authority.'
