name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start validation timer
        id: timer
        shell: bash
        run: echo "started_ns=$(date +%s%N)" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.14"

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Check pull request diff whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test -n "$PR_BASE"
            git merge-base --is-ancestor "$PR_BASE" HEAD
            git diff --check "$PR_BASE...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Fast contract tests
        shell: bash
        run: |
          set -euo pipefail
          fast_tests=()
          while IFS= read -r test_path || [[ -n "$test_path" ]]; do
            [[ -z "${test_path//[[:space:]]/}" || "$test_path" == \#* ]] && continue
            case "$test_path" in
              tests/test_*.py) ;;
              *) echo "Invalid fast-test manifest entry: $test_path" >&2; exit 1 ;;
            esac
            test -f "$test_path"
            fast_tests+=("$test_path")
          done < .github/fast-tests.txt
          test "${#fast_tests[@]}" -gt 0
          printf 'Running %s fast-test manifest files\n' "${#fast_tests[@]}"
          uv run --no-sync python - "${fast_tests[@]}" <<'PY'
          import re
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          required = sys.argv[1:]
          shards = [[], []]
          for line in Path(".github/fast-test-shards.txt").read_text().splitlines():
              if not line.strip() or line.lstrip().startswith("#"):
                  continue
              fields = line.split()
              if len(fields) != 2 or fields[0] not in {"0", "1"}:
                  raise SystemExit(f"Invalid shard mapping: {line}")
              shard, path = fields
              if not re.fullmatch(r"tests/test_[A-Za-z0-9_]+\.py", path) or not Path(path).is_file():
                  raise SystemExit(f"Invalid shard test path: {path}")
              shards[int(shard)].append(path)
          assigned = shards[0] + shards[1]
          if (
              not all(shards)
              or len(required) != len(set(required))
              or len(assigned) != len(set(assigned))
              or set(assigned) != set(required)
          ):
              raise SystemExit("Shards must be non-empty and partition the exact required manifest")

          with tempfile.TemporaryDirectory(prefix="fast-test-shards-") as directory:
              logs = [Path(directory) / f"shard-{i}.log" for i in range(2)]
              handles = [path.open("w") for path in logs]
              try:
                  processes = []
                  for i, modules in enumerate(shards):
                      print(f"Running shard {i}: {len(modules)} whole test files", flush=True)
                      processes.append(subprocess.Popen(
                          ["uv", "run", "--no-sync", "pytest", "--maxfail=1", *modules],
                          stdout=handles[i], stderr=subprocess.STDOUT,
                      ))
                  statuses = [process.wait() for process in processes]
              finally:
                  for handle in handles:
                      handle.close()
              for i, log in enumerate(logs):
                  print(f"=== Required test shard {i} (exit {statuses[i]}) ===", flush=True)
                  print(log.read_text(), end="", flush=True)
              raise SystemExit(1 if any(statuses) else 0)
          PY

      - name: CLI smoke
        env:
          TERM: dumb
        run: uv run --no-sync fh-agent --help

      - name: Report validation duration
        env:
          STARTED_NS: ${{ steps.timer.outputs.started_ns }}
        shell: bash
        run: |
          set -euo pipefail
          finished_ns=$(date +%s%N)
          elapsed_ms=$(( (finished_ns - STARTED_NS) / 1000000 ))
          printf 'validate job execution: %s ms\n' "$elapsed_ms"
          {
            echo '### Required validate timing'
            printf -- '- Job execution: `%s ms`\n' "$elapsed_ms"
            echo '- Budget: `<= 120000 ms`'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$elapsed_ms" -le 120000

  research-map-migration-shard:
    name: research-map-migration-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shard: ["0", "1", "2", "3"]
    steps:
      - name: Start migration validation timer
        id: timer
        shell: bash
        run: echo "started_ns=$(date +%s%N)" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.14"

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Verify Research Map shard coverage
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ strategy.job-total }}
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python - .github/research-map-shards.txt "$SHARD" "$SHARD_TOTAL" \
            > "$RUNNER_TEMP/research-map-shard-node-ids.txt" <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          MODULE = "tests/test_final_research_map.py"
          manifest, shard, total = sys.argv[1], sys.argv[2], int(sys.argv[3])
          if len(sys.argv) > 4:
              collected = Path(sys.argv[4]).read_text().splitlines()
          else:
              output = subprocess.run(
                  [sys.executable, "-m", "pytest", "--collect-only", "-q", "-p", "no:cacheprovider", MODULE],
                  check=True, capture_output=True, text=True,
              ).stdout
              collected = [line for line in output.splitlines() if line.startswith(MODULE + "::")]
          assignments = {}
          for line in Path(manifest).read_text().splitlines():
              if not line.strip() or line.lstrip().startswith("#"):
                  continue
              fields = line.split(" ", 1)
              if len(fields) != 2 or not fields[0].isdigit() or not fields[1].startswith(MODULE + "::"):
                  raise SystemExit(f"Invalid shard mapping: {line}")
              if fields[1] in assignments:
                  raise SystemExit(f"Duplicate shard node ID: {fields[1]}")
              assignments[fields[1]] = fields[0]
          missing = sorted(set(collected) - set(assignments))
          unknown = sorted(set(assignments) - set(collected))
          if not collected or len(collected) != len(set(collected)) or missing or unknown:
              raise SystemExit(f"Shard manifest mismatch: missing={missing} unknown={unknown}")
          declared = set(assignments.values())
          if declared != {str(i) for i in range(total)}:
              raise SystemExit(
                  f"Declared shards {sorted(declared)} must be exactly 0..{total - 1} without gaps"
              )
          if shard not in declared:
              raise SystemExit(f"Shard {shard} has no node IDs")
          own = [node_id for node_id, owner in assignments.items() if owner == shard]
          print(f"Shard {shard}: {len(own)} of {len(collected)} node IDs", file=sys.stderr)
          print("\n".join(own))
          PY

      - name: Final Research Map migration acceptance
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t node_ids < "$RUNNER_TEMP/research-map-shard-node-ids.txt"
          test "${#node_ids[@]}" -gt 0
          uv run --no-sync pytest -n 2 --durations=20 "${node_ids[@]}"

      - name: Report migration validation duration
        env:
          STARTED_NS: ${{ steps.timer.outputs.started_ns }}
          SHARD: ${{ matrix.shard }}
        shell: bash
        run: |
          set -euo pipefail
          finished_ns=$(date +%s%N)
          elapsed_ms=$(( (finished_ns - STARTED_NS) / 1000000 ))
          printf 'research-map-migration shard %s job execution: %s ms\n' "$SHARD" "$elapsed_ms"
          {
            echo "### Research Map migration acceptance timing (shard $SHARD)"
            printf -- '- Job execution: `%s ms`\n' "$elapsed_ms"
            echo '- Budget: `<= 120000 ms`'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$elapsed_ms" -le 120000

  research-map-migration:
    name: research-map-migration
    needs: research-map-migration-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Research Map shard to succeed
        env:
          SHARD_RESULT: ${{ needs.research-map-migration-shard.result }}
        shell: bash
        run: |
          set -euo pipefail
          echo "research-map-migration-shard result: $SHARD_RESULT"
          test "$SHARD_RESULT" = "success"
