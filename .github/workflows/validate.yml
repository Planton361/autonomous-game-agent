name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    needs: [fast-contracts, research-map-migration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start validation timer
        id: timer
        shell: bash
        run: echo "started_ns=$(date +%s%N)" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.14"

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Check pull request diff whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test -n "$PR_BASE"
            git merge-base --is-ancestor "$PR_BASE" HEAD
            git diff --check "$PR_BASE...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: CLI smoke
        env:
          TERM: dumb
        run: uv run --no-sync fh-agent --help

      - name: Report validation duration
        env:
          STARTED_NS: ${{ steps.timer.outputs.started_ns }}
        shell: bash
        run: |
          set -euo pipefail
          finished_ns=$(date +%s%N)
          elapsed_ms=$(( (finished_ns - STARTED_NS) / 1000000 ))
          printf 'validate job execution: %s ms\n' "$elapsed_ms"
          {
            echo '### Required validate timing'
            printf -- '- Job execution: `%s ms`\n' "$elapsed_ms"
            echo '- Budget: `<= 60000 ms`'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$elapsed_ms" -le 60000

  fast-contracts:
    name: fast-contracts-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - name: Start validation timer
        id: timer
        shell: bash
        run: echo "started_ns=$(date +%s%N)" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.14"

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Exact-partition fast contract tests
        env:
          TEST_SHARD: ${{ matrix.shard }}
        shell: bash
        run: |
          set -euo pipefail
          fast_tests=()
          while IFS= read -r test_path || [[ -n "$test_path" ]]; do
            [[ -z "${test_path//[[:space:]]/}" || "$test_path" == \#* ]] && continue
            case "$test_path" in
              tests/test_*.py) ;;
              *) echo "Invalid fast-test manifest entry: $test_path" >&2; exit 1 ;;
            esac
            test -f "$test_path"
            fast_tests+=("$test_path")
          done < .github/fast-tests.txt
          test "${#fast_tests[@]}" -gt 0
          printf 'Running %s fast-test manifest files\n' "${#fast_tests[@]}"
          uv run --no-sync python - "${fast_tests[@]}" <<'PY'
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          required = sys.argv[1:]
          shards = [[], [], []]
          for line in Path(".github/fast-test-shards.txt").read_text().splitlines():
              if not line.strip() or line.lstrip().startswith("#"):
                  continue
              fields = line.split()
              if len(fields) != 2 or fields[0] not in {"0", "1", "2"}:
                  raise SystemExit(f"Invalid shard mapping: {line}")
              shard, path = fields
              if not re.fullmatch(r"tests/test_[A-Za-z0-9_]+\.py", path) or not Path(path).is_file():
                  raise SystemExit(f"Invalid shard test path: {path}")
              shards[int(shard)].append(path)
          assigned = [path for shard in shards for path in shard]
          if (
              not all(shards)
              or len(required) != len(set(required))
              or len(assigned) != len(set(assigned))
              or set(assigned) != set(required)
          ):
              raise SystemExit("Shards must be non-empty and partition the exact required manifest")

          selected = int(os.environ["TEST_SHARD"])
          print(f"Running shard {selected}: {len(shards[selected])} whole test files", flush=True)
          raise SystemExit(subprocess.call(
              ["uv", "run", "--no-sync", "pytest", "--maxfail=1", *shards[selected]],
          ))
          PY

      - name: Report validation duration
        env:
          STARTED_NS: ${{ steps.timer.outputs.started_ns }}
        shell: bash
        run: |
          set -euo pipefail
          finished_ns=$(date +%s%N)
          elapsed_ms=$(( (finished_ns - STARTED_NS) / 1000000 ))
          printf 'fast-contracts job execution: %s ms\n' "$elapsed_ms"
          {
            echo '### Required fast-contract timing'
            printf -- '- Job execution: `%s ms`\n' "$elapsed_ms"
            echo '- Budget: `<= 60000 ms`'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$elapsed_ms" -le 60000

  research-map-migration:
    name: research-map-migration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start migration validation timer
        id: timer
        shell: bash
        run: echo "started_ns=$(date +%s%N)" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.14"

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Final Research Map migration acceptance
        run: uv run --no-sync pytest -n 2 tests/test_final_research_map.py

      - name: Report migration validation duration
        env:
          STARTED_NS: ${{ steps.timer.outputs.started_ns }}
        shell: bash
        run: |
          set -euo pipefail
          finished_ns=$(date +%s%N)
          elapsed_ms=$(( (finished_ns - STARTED_NS) / 1000000 ))
          printf 'research-map-migration job execution: %s ms\n' "$elapsed_ms"
          {
            echo '### Research Map migration acceptance timing'
            printf -- '- Job execution: `%s ms`\n' "$elapsed_ms"
            echo '- Budget: `<= 60000 ms`'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$elapsed_ms" -le 60000
